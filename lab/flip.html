<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>curl lab</title>
<style>
  html,body{margin:0;height:100%;background:#efeae1;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;overflow:hidden}
  #book{position:fixed;inset:0;display:flex;background:#fff}
  .pg{position:relative;width:50%;height:100%;overflow:hidden;background:#fff}
  .pg .hd{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:10px;color:#9c9c9c;letter-spacing:.1em}
  .pg .bd{position:absolute;top:52px;bottom:40px;left:40px;right:40px;font-size:14px;line-height:1.8;color:#191919;text-align:justify}
  .pg .bd p{margin:0 0 .3em}
  .pg .bd b{font-size:.6em;color:#9c9c9c;margin-right:.4em;vertical-align:super;font-weight:500}
  .pg .ft{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:10px;color:#9c9c9c}
  #hud{position:fixed;left:10px;bottom:10px;z-index:99;background:rgba(0,0,0,.78);color:#fff;padding:7px 10px;border-radius:8px;font:11px/1.4 ui-monospace,monospace}
  #hud input{width:190px;vertical-align:middle}
</style>
</head>
<body>
<div id="book"></div>
<div id="hud">각도 <input id="ang" type="range" min="0" max="180" value="0" step="1"><span id="angv">0</span>°</div>
<script>
var SENT = ["태초에 하나님이 천지를 창조하시니라 땅이 혼돈하고 공허하며 흑암이 깊음 위에 있고 하나님의 신은 수면에 운행하시니라",
            "하나님이 가라사대 빛이 있으라 하시매 빛이 있었고 그 빛이 하나님의 보시기에 좋았더라 하나님이 빛과 어두움을 나누사",
            "빛을 낮이라 칭하시고 어두움을 밤이라 칭하시니라 저녁이 되며 아침이 되니 이는 첫째 날이니라"];

function makePage(title, pageNo, seed){
  var d=document.createElement('div'); d.className='pg';
  var hd=document.createElement('div'); hd.className='hd'; hd.textContent=title; d.appendChild(hd);
  var bd=document.createElement('div'); bd.className='bd';
  var out='';
  for(var v=1;v<5;v++){ out+='<p><b>'+v+'</b>'+SENT[(seed+v)%3].slice(0,42)+'</p>'; }
  out+='<p>— '+title+' · '+pageNo+'</p>';
  bd.innerHTML=out; d.appendChild(bd);
  var ft=document.createElement('div'); ft.className='ft'; ft.textContent=pageNo; d.appendChild(ft);
  return d;
}

var book=document.getElementById('book');
var P={ curL:makePage('창세기 1장', 12, 1), curR:makePage('창세기 1장', 13, 2),
        tgtL:makePage('창세기 2장', 14, 3), tgtR:makePage('창세기 2장', 15, 4) };
book.appendChild(P.curL); book.appendChild(P.curR);

/* ── paper curl engine ──────────────────────────────────────── */
var SEGS = 6, ZONE = 0.44, BEND = 30;

function el(tag, cls){ var e=document.createElement(tag); if(cls) e.className=cls; return e; }
function clonePage(node, W, H){
  var n=node.cloneNode(true);
  n.setAttribute('aria-hidden','true');
  n.style.position='absolute'; n.style.left='0'; n.style.top='0';
  n.style.width=W+'px'; n.style.height=H+'px'; n.style.margin='0';
  return n;
}

var F = { root:null, leaf:null, cards:[], cover:null, W:0, H:0, forward:true, single:false };

function buildCurl(){
  var W = Math.round(window.innerWidth*(F.single?1:0.5)), H = window.innerHeight;
  F.W=W; F.H=H;
  var root = el('div','flip');
  root.style.cssText='position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden;'+
    'perspective:'+Math.round(Math.max(2800, W*4.4))+'px;perspective-origin:50% 50%;';

  var baseCss='position:absolute;top:0;height:100%;overflow:hidden;background:#fff;';
  var ul = el('div','under l'), ur = el('div','under r');
  ul.style.cssText=baseCss+'left:0;width:50%;';
  ur.style.cssText=baseCss+'right:0;width:50%;';
  if(!F.single){
    ul.appendChild(clonePage(P.tgtL, W, H)); ur.appendChild(clonePage(P.tgtR, W, H));
  }else{
    ul.style.width='100%'; ur.style.display='none'; ul.appendChild(clonePage(P.tgtR, W, H));
  }
  root.appendChild(ul); root.appendChild(ur);

  if(!F.single){
    var cov = el('div','cover');
    cov.style.cssText = 'position:absolute;top:0;height:100%;width:50%;overflow:hidden;background:#fff;z-index:2;'+
      (F.forward?'left:0;':'right:0;');
    cov.appendChild(clonePage(F.forward?P.curL:P.curR, W, H));
    root.appendChild(cov); F.cover=cov;
  }

  var leaf = el('div','leaf');
  leaf.style.cssText='position:absolute;top:0;height:100%;width:'+(F.single?'100%':'50%')+';z-index:4;'+
    'transform-style:preserve-3d;will-change:transform;'+
    (F.forward ? 'left:'+(F.single?0:W)+'px;transform-origin:0 50%;'
               : 'left:0;transform-origin:100% 50%;');
  F.cards=[];
  var flatW = W*ZONE, sw=(W-flatW)/SEGS;
  for(var i=0;i<=SEGS;i++){
    var w = i===0 ? flatW : sw;
    var card = el('div','card');
    card.style.cssText='position:absolute;top:0;height:100%;overflow:hidden;'+
      'backface-visibility:hidden;will-change:transform;';
    card.style.width=(w+1.5)+'px';
    card.style.transformOrigin = F.forward ? '0 50%' : '100% 50%';
    var f=el('div','face f');
    f.style.cssText='position:absolute;inset:0;overflow:hidden;';
    f.appendChild(clonePage(F.forward?P.curR:P.curL, W, H));
    var b=el('div','face b');
    b.style.cssText='position:absolute;inset:0;overflow:hidden;';
    var bw=el('div','bw');
    bw.style.cssText='position:absolute;top:0;left:0;width:'+W+'px;height:100%;transform-origin:50% 50%;';
    bw.appendChild(clonePage(F.forward?P.tgtL:P.tgtR, W, H));
    b.appendChild(bw);
    var sh=el('div','sh');
    sh.style.cssText='position:absolute;inset:0;pointer-events:none;';
    card.appendChild(f); card.appendChild(b); card.appendChild(sh);
    leaf.appendChild(card);
    F.cards.push({el:card, f:f, b:b, bw:bw, sh:sh, w:w});
  }
  root.appendChild(leaf); F.leaf=leaf;
  document.body.appendChild(root);
  F.root=root;
  return F;
}

function shadeCss(alphaL, alphaR, warm){
  var c = warm ? '255,250,240' : '0,0,0';
  return 'linear-gradient(to right,rgba('+c+','+alphaL.toFixed(3)+'),rgba('+c+','+alphaR.toFixed(3)+'))';
}

function applyCurl(a){
  if(!F.root) return;
  F.leaf.style.transform='rotateY('+(F.forward?-a:a)+'deg)';
  var bend = BEND*Math.pow(Math.sin(Math.PI*Math.min(1,a/180)),0.72);

  var ws=[], sum=0;
  for(var i=1;i<=SEGS;i++){ var v=Math.pow(i,1.4); ws.push(v); sum+=v; }
  var tilts=[]; acc=0;
  for(var i=0;i<SEGS;i++){ acc += bend*ws[i]/sum; tilts.push(acc); }

  var X=0, Z=0;
  for(var k=0;k<F.cards.length;k++){
    var c=F.cards[k];
    var th = k===0 ? 0 : tilts[k-1];
    var rad=th*Math.PI/180, w=c.w;
    var x = F.forward ? X : (F.W - X - w);
    c.el.style.transform='translate3d('+(F.forward?X:-X)+'px,0,'+Z+'px) rotateY('+(F.forward?-th:th)+'deg)';
    c.f.firstChild.style.left=(-x)+'px';
    c.bw.style.left=(-x)+'px';
    var thL = k<=1 ? 0 : tilts[k-2];
    var wt=(a+th)*Math.PI/180;
    var front = Math.cos(wt)>=0;
    c.f.style.visibility = front?'visible':'hidden';
    c.b.style.visibility = front?'hidden':'visible';
    function alpha(t){
      var cf=Math.cos((a+t)*Math.PI/180);
      return front ? (1-Math.max(0,cf))*0.30 : (1-Math.max(0,-cf))*0.20;
    }
    c.sh.style.background = shadeCss(alpha(thL), alpha(th), !front);
    X += w*Math.cos(rad);
    Z += w*Math.sin(rad);
  }
}

document.getElementById('ang').addEventListener('input', function(e){
  var a=+e.target.value;
  document.getElementById('angv').textContent=a;
  applyCurl(a);
});
buildCurl(); applyCurl(0);
window.__lab={apply:applyCurl, F:F};
</script>
</body></html>
